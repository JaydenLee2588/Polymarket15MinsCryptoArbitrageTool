groups:
  - id: "Pattern策略5"
    trend_window_sec_start: 720
    trend_window_sec_end: 780
    leg0_share_price_0: 0.50
    leg1_share_price_1: 0.85
    leg1_share_price_2: 0.86
    leg1_share_price_3: 0.95
    leg1_share_amount_1: 5
    leg1_share_amount_2: 4
    leg1_share_amount_3: 3
    max_slippage: 0.03
    patterns:
      - "单边上涨"
      - "单边下跌"
    sell_threshold: 0.1
    enable_stop_loss: false
    stop_loss_minutes_before_close: 1
    symbols:
      - "BTC"
      - "ETH"
      - "SOL"
      - "XRP"

  - id: "Pattern策略5+Sniper"
    trend_window_sec_start: 720
    trend_window_sec_end: 780
    leg0_share_price_0: 0.50
    leg1_share_price_1: 0.85
    leg1_share_price_2: 0.86
    leg1_share_price_3: 0.95
    leg1_share_amount_1: 5
    leg1_share_amount_2: 4
    leg1_share_amount_3: 3
    max_slippage: 0.03
    patterns:
      - "单边上涨"
      - "单边下跌"
    sell_threshold: 0.15
    enable_stop_loss: false
    stop_loss_minutes_before_close: 1
    sniper:
      zscore_entry_threshold: 1.3  # 激进调整: 从 1.8 降到 1.3
      zscore_exit_threshold: 0.8
      spread_max: 0.08
      dead_fish_min_edge: 0.01
      edge_threshold: 0.03  # 放宽: 从 0.05 降到 0.03
    symbols:
      - "BTC"
      - "ETH"
      - "SOL"
      - "XRP"