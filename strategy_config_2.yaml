    leg1_share_price_2: 0.90
    leg1_share_price_3: 0.99
    leg1_share_amount_1: 20           # [对比] 单笔很少，旨在测试/刷单
    leg1_share_amount_2: 20
    leg1_share_amount_3: 20
    max_slippage: 0.01                # [对比] 严控滑点
    price_tick_size: 0.01
    sigmoid_sensitivity: 2.5          # [对比] 极其敏感
    volatility_btc: 0.0010            # 低波环境
    volatility_eth: 0.0010
    volatility_sol: 0.0010
    volatility_xrp: 0.0010
    tier_0_z_score: 0.6       # [对比] 稍微有点信号就做
    tier_1_z_score: 0.8
    tier_2_z_score: 1.0
    tier_3_z_score: 1.2
    tier_4_z_score: 1.5
    min_edge_tier_0: 0.01     # 只要有1分钱利差就做
    min_edge_tier_1: 0.00     # 平价也做
    min_edge_tier_2: 0.00
    min_edge_tier_3: 0.00
    min_edge_tier_4: 0.00

  - id: "全面对比5-尾盘伽马"
    # 策略思路: 放弃前中期的趋势博弈，专攻最后 3 分钟 (如 600s-800s)。
    # 核心逻辑: 利用时间流逝导致的 Gamma 效应（时间越少，同等涨幅的确定性越高）。此时Z-score极容易飙升，胜率极高，专捡确定性的“临门一脚”行情。
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.0013
    min_trend_percent_down: 0.0013
    trend_window_sec_start: 600      # [对比] 尾盘启动
    trend_window_sec_end: 800        # [对比] 
    
    leg0_share_price_0: 0.61
    leg1_share_price_1: 0.71
    leg1_share_price_2: 0.80
    leg1_share_price_3: 0.96
