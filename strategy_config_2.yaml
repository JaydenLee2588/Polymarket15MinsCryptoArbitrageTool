  - id: "全面对比9-中位狙击"
    # 策略思路: 避开低价区的随机噪音和高价区的接盘风险，专做概率跃迁最快的中间段。
    # 核心逻辑: 将买入价格严格锁死在 Sigmoid 函数斜率最陡峭的区间（如 0.65 - 0.75）。在这个区间，哪怕市场只涨 0.1%，期权价格也会剧烈重估，套利空间最大。
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.0013
    min_trend_percent_down: 0.0013
    trend_window_sec_start: 350
    trend_window_sec_end: 480
    
    # [对比] 窄区间
