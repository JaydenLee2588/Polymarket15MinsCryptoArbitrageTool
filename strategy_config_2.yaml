    # 核心逻辑: 彻底关闭 Tier 0 和 Tier 1 的交易，只在 Tier 3 和 Tier 4 (Z-score > 1.5) 的极高确信度下开火，并且此时投入 3-5 倍的重仓（如单次买 150 手），用确定性换取绝对利润。
