  - id: "全面对比10-强趋势突破"
    # 策略思路: 价格行为 (Price Action) 优先。不依赖时间窗口或低价，而是依赖“大幅度的趋势形态”。
    # 核心逻辑: 设置极高的趋势阈值 (0.25%)，过滤掉所有震荡和噪音。一旦检测到强力突破信号 (Breakout)，大幅降低 Z-score 和 Edge 门槛，立即跟随趋势进场。
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.0025      # [对比] 极高阈值 (0.25%)，只做大行情
    min_trend_percent_down: 0.0025    # [对比]
    trend_window_sec_start: 150      # [对比] 只要趋势出来，可以很早进场
    trend_window_sec_end: 600
    
    leg0_share_price_0: 0.61
    leg1_share_price_1: 0.71
    leg1_share_price_2: 0.85          # [对比] 允许较高位置追突破
    leg1_share_price_3: 0.97          # [对比] 接近满值也追
    
    leg1_share_amount_1: 50
    leg1_share_amount_2: 50
    leg1_share_amount_3: 50

    max_slippage: 0.05                # 突破行情波动大，稍宽滑点
    price_tick_size: 0.01

    sigmoid_sensitivity: 2.2          # [对比] 高K值，一旦突破，S曲线迅速拉升
    volatility_btc: 0.0012
    volatility_eth: 0.0012
    volatility_sol: 0.0012
    volatility_xrp: 0.0012

    # Tier: 趋势已经确认，Z的要求可以降低
    tier_0_z_score: 0.8       # [对比] 只要Z > 0.8 就进 (因为有强趋势背书)
    tier_1_z_score: 1.0
    tier_2_z_score: 1.2
    tier_3_z_score: 1.4
    tier_4_z_score: 1.8
    
    min_edge_tier_0: 0.01     # [对比] 只要微弱优势即可
    min_edge_tier_1: 0.00     # 平价即可
    min_edge_tier_2: 0.00
    min_edge_tier_3: 0.00
    min_edge_tier_4: 0.00
