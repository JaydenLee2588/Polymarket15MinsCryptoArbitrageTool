  - id: "全面对比1-激进早盘"
    # 策略思路: 降低准入门槛，提前进场，抢占先机，但容忍更低胜率。
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.0008      # 降低: 0.13% -> 0.08%，更早捕捉微弱趋势
    min_trend_percent_down: 0.0008    # 降低: 0.13% -> 0.08%
    trend_window_sec_start: 200       # 提前: 350s -> 200s (3分20秒)，不做过多等待
    trend_window_sec_end: 450         # 提前结束: 450s
    # 资金: 略微激进
    leg0_share_price_0: 0.61
    leg1_share_price_1: 0.73          # 提高: 允许稍高价格买入
    leg1_share_price_2: 0.82          # [对比] 提高: 允许稍高价格买入
    leg1_share_price_3: 0.97          # [对比] 提高: 几乎接近归一价，敢于追高
    leg1_share_amount_1: 60           # [对比] 增加: 头寸稍大
    leg1_share_amount_2: 55
    leg1_share_amount_3: 45
    max_slippage: 0.05                # [对比] 放宽: 允许更大滑点抢单
    price_tick_size: 0.01
    sigmoid_sensitivity: 1.9          # [对比] 提高: 对趋势更敏感，S曲线更陡
    volatility_btc: 0.0012            # 保持一致
    volatility_eth: 0.0012
    volatility_sol: 0.0012
    volatility_xrp: 0.0012
    # Tier: 整体下移，更容易触发
    tier_0_z_score: 0.9       # [对比] 降低: 1.2 -> 0.9，极早触发
    tier_1_z_score: 1.1       # [对比] 降低
    tier_2_z_score: 1.3
    tier_3_z_score: 1.5
    tier_4_z_score: 1.8
    min_edge_tier_0: 0.02     # [对比] 降低优势要求，只求上车
    min_edge_tier_1: 0.01
    min_edge_tier_2: 0.00
    min_edge_tier_3: 0.00
    min_edge_tier_4: -0.01    # [对比] 甚至允许微亏买入(负优势)，赌后续涨幅

  - id: "全面对比2-保守确认"
    # 策略思路: 只要最稳的单子，过滤噪音，大幅提高门槛。
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.0020      # 提高: 0.13% -> 0.20%，必须有显著趋势
    min_trend_percent_down: 0.0020    # 提高
    trend_window_sec_start: 450       # 推后: 350s -> 450s，等待趋势完全成型
    trend_window_sec_end: 700         # 延长窗口
    # 资金: 保守低吸
    leg0_share_price_0: 0.55          # 降低: 只买便宜货
    leg1_share_price_1: 0.65          # 收窄区间
    leg1_share_price_2: 0.75
    leg1_share_price_3: 0.85          # [对比] 拒绝追高
    leg1_share_amount_1: 50           # 正常仓位
    leg1_share_amount_2: 45
    leg1_share_amount_3: 40
    max_slippage: 0.02                # [对比] 收紧: 不接受大滑点
    price_tick_size: 0.01
    sigmoid_sensitivity: 1.5          # [对比] 降低: 反应迟钝一点，过滤毛刺
    volatility_btc: 0.0012
    volatility_eth: 0.0012
    volatility_sol: 0.0012
    volatility_xrp: 0.0012
    # Tier: 整体上移，极难触发
    tier_0_z_score: 1.5       # [对比] 提高: 1.5起步
    tier_1_z_score: 1.7
    tier_2_z_score: 2.0
    tier_3_z_score: 2.3
    tier_4_z_score: 2.6
    min_edge_tier_0: 0.05     # [对比] 要求巨大安全垫 (5美分)
    min_edge_tier_1: 0.03
    min_edge_tier_2: 0.02
    min_edge_tier_3: 0.01
    min_edge_tier_4: 0.00

  - id: "全面对比3-高波博弈"
    # 策略思路: 针对高波动行情，放宽波动率因子，寻找深跌反弹或暴涨机会。
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.0015
    min_trend_percent_down: 0.0015
    trend_window_sec_start: 300
    trend_window_sec_end: 550         # 略微放大
    # 资金: 广撒网
    leg0_share_price_0: 0.60
