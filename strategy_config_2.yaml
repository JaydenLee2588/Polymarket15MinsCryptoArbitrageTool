    leg1_share_amount_2: 40
    leg1_share_amount_3: 40
    max_slippage: 0.06                # [对比] 容忍高滑点
    price_tick_size: 0.01
    sigmoid_sensitivity: 1.2          # [对比] 极低敏感度(S曲线平缓)，因为Z分数会很大
    volatility_btc: 0.0025            # [对比] 假设波动率翻倍
    volatility_eth: 0.0025
    volatility_sol: 0.0025
    volatility_xrp: 0.0025
    # Tier: 适应高波动率分母
    tier_0_z_score: 1.0       # 调整后的Z
    tier_1_z_score: 1.2
    tier_2_z_score: 1.5
    tier_3_z_score: 1.8
    tier_4_z_score: 2.2
    min_edge_tier_0: 0.04     # 波动大，spread也大，要求高edge
    min_edge_tier_1: 0.02
    min_edge_tier_2: 0.01
    min_edge_tier_3: 0.00
    min_edge_tier_4: -0.02    # 极高Z时敢于taker吃损

  - id: "全面对比4-微利刷单"
    # 策略思路: 积少成多，极低门槛，极低利润要求，高频。
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.0005      # [对比] 极微小趋势即可
    min_trend_percent_down: 0.0005
    trend_window_sec_start: 180      # 开盘即战
    trend_window_sec_end: 600        # 全程
