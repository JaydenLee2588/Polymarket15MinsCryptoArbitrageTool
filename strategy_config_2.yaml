groups:
  - id: "AI测试参数1"
    min_trend_percent_up: 0.0016       # 保持中等敏感度
    min_trend_percent_down: 0.0004
    trend_window_sec_start: 397
    trend_window_sec_end: 618         # 适中窗口
    leg0_share_price_0: 0.01          # 提高底部保护，太便宜的往往是死单
    leg1_share_price_1: 0.62
    leg1_share_price_2: 0.7681
    leg1_share_price_3: 0.908
    leg1_share_amount_1: 100
    leg1_share_amount_2: 54
    leg1_share_amount_3: 50
    max_slippage: 0.02                # [重点] 严控滑点
    price_tick_size: 0.01
    sigmoid_sensitivity: 5.0          # 适中
    volatility_btc: 0.0029
    volatility_eth: 0.0005
    volatility_sol: 0.0016
    volatility_xrp: 0.0071
    tier_0_z_score: 0.8167               # 提高门槛，过滤杂音
    tier_1_z_score: 1.3581
    tier_2_z_score: 1.5271
    tier_3_z_score: 2.4689
    tier_4_z_score: 3.5042
    min_edge_tier_0: -0.8049             # 弱信号要求大优势
    min_edge_tier_1: 0.0033
    min_edge_tier_2: -0.7168
    min_edge_tier_3: -0.8100
    min_edge_tier_4: -0.04319             # [重点] 即使强信号，也必须有 1分钱优势

  - id: "终极_仿AI暴力突破"
    # 核心逻辑复刻:
    # 1. 极高K值 (复刻 K=5.0) -> 信号极度敏感
    # 2. 负Edge (复刻 -0.8) -> 允许追涨，不做估值
    # 3. 严格限价 (复刻 0.908) -> 锁死利润空间
    # 4. 中段窗口 (复刻 397-618) -> 只吃鱼身
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.0016      # 抄作业
    min_trend_percent_down: 0.0016
    trend_window_sec_start: 390       # 约 6.5 分钟
    trend_window_sec_end: 620         # 约 10.5 分钟 
    leg0_share_price_0: 0.60          # 底部保护
    leg1_share_price_1: 0.70
    leg1_share_price_2: 0.80
    leg1_share_price_3: 0.90          # [核心抄作业] 坚决不超过 0.90 (AI是0.908)
    # [核心抄作业] 倒金字塔仓位
    leg1_share_amount_1: 100          # 底部重仓
    leg1_share_amount_2: 60
    leg1_share_amount_3: 40
    max_slippage: 0.02                # [核心抄作业] 严控滑点
    price_tick_size: 0.01
    sigmoid_sensitivity: 4.0          # [核心抄作业] 既然5.0有效，我们就敢开4.0
    # 波动率回归人类通用值 (AI的太偏激，可能过拟合)
    volatility_btc: 0.0012
    volatility_eth: 0.0012
    volatility_sol: 0.0012
    volatility_xrp: 0.0012
    tier_0_z_score: 1.0
    tier_1_z_score: 1.2
    tier_2_z_score: 1.4
    tier_3_z_score: 1.6
    tier_4_z_score: 2.0    
    # [核心抄作业] 允许平价甚至溢价买入 (只要趋势对)
    min_edge_tier_0: 0.00
    min_edge_tier_1: 0.00
    min_edge_tier_2: -0.01            # 允许亏1分钱买
    min_edge_tier_3: -0.02            # 允许亏2分钱买
    min_edge_tier_4: -0.03            # 允许亏3分钱买

  - id: "基准1号"
    min_trend_percent_up: 0.0013      # 做多最小趋势阈值 (0.1%)，只有涨幅超过此值才开始计算
    min_trend_percent_down: 0.0013    # 做空最小趋势阈值 (0.1%)，只有跌幅超过此值才开始计算
    trend_window_sec_start: 320       # 趋势检测窗口起点: 开盘后 300秒 (约5分钟) 开始
    trend_window_sec_end: 480         # 趋势检测窗口终点: 开盘后 480秒 (8分钟) 停止检测
    leg0_share_price_0: 0.62          # 保护性低价: 价格低于 0.63美分不买 (避免垃圾归零单)
    leg1_share_price_1: 0.72          # 分档买入: 价格在 (0.54, 0.66] 区间
    leg1_share_price_2: 0.79          # 分档买入: 价格在 (0.66, 0.78] 区间  
    leg1_share_price_3: 0.86          # 最高买入价: 价格高于 0.96 (96美分) 不再追高
    leg1_share_amount_1: 70           # 档位 1 的单笔买入 Share 数量
    leg1_share_amount_2: 50           # 档位 2 的单笔买入 Share 数量
    leg1_share_amount_3: 30           # 档位 3 的单笔买入 Share 数量
    max_slippage: 0.03                # 最大允许滑点 (单位: 美元)，用于 Taker 吃单保护
    price_tick_size: 0.01             # 交易所最小价格变动单位 (1美分)
    sigmoid_sensitivity: 1.8          # K值敏感度: 控制S曲线陡峭程度。值越小越保守，越大越激进
    volatility_btc: 0.0012             # BTC 波动率因子 (0.15%): 用于 Z-Score 分母标准化
    volatility_eth: 0.0012             # ETH 波动率因子 (0.12%)
    volatility_sol: 0.0024             # SOL 波动率因子 (0.12%)
    volatility_xrp: 0.0015             # XRP 波动率因子 (0.15%)
    tier_0_z_score: 1.5       # Tier 0 门槛: Z < 0.6 时，信号无效，不交易
    tier_1_z_score: 1.6       # Tier 1 门槛: 0.6 <= Z < 0.8
    tier_2_z_score: 1.7       # Tier 2 门槛: 0.8 <= Z < 1.0
    tier_3_z_score: 1.8       # Tier 3 门槛: 1.0 <= Z < 1.4
    tier_4_z_score: 2.0       # Tier 4 门槛: Z >= 2.0
    min_edge_tier_0: 0.03     # Z [0.6, 0.8): 信号微弱，要求极大优势 (13美分) 才买
    min_edge_tier_1: 0.02     # Z [0.8, 1.0): 信号一般，要求较大优势 (10美分)
    min_edge_tier_2: 0.01     # Z [1.0, 1.4): 信号较强，要求中等优势 (6美分)
    min_edge_tier_3: 0.00     # Z [1.4, 2.0): 信号很强，要求微小优势 (3美分)
    min_edge_tier_4: 0.00     # Z >= 2.0:     信号极强，只要不亏本 (0优势) 就可以抢单一

  - id: "基本2号"
    min_trend_percent_up: 0.002       # 保持中等敏感度
    min_trend_percent_down: 0.002
    trend_window_sec_start: 300
    trend_window_sec_end: 450         # 适中窗口
    leg0_share_price_0: 0.62          # 提高底部保护，太便宜的往往是死单
    leg1_share_price_1: 0.72
    leg1_share_price_2: 0.80
    leg1_share_price_3: 0.85          # [重点] 严控最高价，绝并不追 0.90 以上
    leg1_share_amount_1: 100
    leg1_share_amount_2: 70
    leg1_share_amount_3: 50
    max_slippage: 0.04                # [重点] 严控滑点
    price_tick_size: 0.01
    sigmoid_sensitivity: 2.0          # 适中
    volatility_btc: 0.0012
    volatility_eth: 0.0012
    volatility_sol: 0.0012
    volatility_xrp: 0.0012
    tier_0_z_score: 1.0               # 提高门槛，过滤杂音
    tier_1_z_score: 1.2
    tier_2_z_score: 1.4
    tier_3_z_score: 1.6
    tier_4_z_score: 2.0
    min_edge_tier_0: 0.05             # 弱信号要求大优势
    min_edge_tier_1: 0.04
    min_edge_tier_2: 0.03
    min_edge_tier_3: 0.02
    min_edge_tier_4: 0.01             # [重点] 即使强信号，也必须有 1分钱优势

  - id: "基本3号"
    min_trend_percent_up: 0.003      # [对比] 极高阈值 (0.25%)，只做大行情
    min_trend_percent_down: 0.003    # [对比]
    trend_window_sec_start: 250       # [对比] 只要趋势出来，可以很早进场
    trend_window_sec_end: 480         # [对比] 延迟离场时间
    leg0_share_price_0: 0.55          # [对比] 低价位
    leg1_share_price_1: 0.72
    leg1_share_price_2: 0.79          # [对比] 允许较高位置追突破
    leg1_share_price_3: 0.86          # [对比] 接近满值也追
    leg1_share_amount_1: 140
    leg1_share_amount_2: 100
    leg1_share_amount_3: 60
    max_slippage: 0.05                # 突破行情波动大，稍宽滑点
    price_tick_size: 0.01
    sigmoid_sensitivity: 2.2          # [对比] 高K值，一旦突破，S曲线迅速拉升
    volatility_btc: 0.0012
    volatility_eth: 0.0012
    volatility_sol: 0.0012
    volatility_xrp: 0.0012
    tier_0_z_score: 0.8       # [对比] 只要Z > 0.8 就进 (因为有强趋势背书)
    tier_1_z_score: 1.0
    tier_2_z_score: 1.2
    tier_3_z_score: 1.4
    tier_4_z_score: 1.8
    min_edge_tier_0: 0.01     # [对比] 只要微弱优势即可
    min_edge_tier_1: 0.00     # 平价即可
    min_edge_tier_2: 0.00
    min_edge_tier_3: 0.00
    min_edge_tier_4: 0.00