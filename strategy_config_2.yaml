  # 逻辑: 在双重保险(时间+价格限制)下，理论上模型可以无限放飞自我。
  # 验证: 把 K 值拉满到 2.0。一旦产生哪怕是 0.2% 的趋势，瞬间打出 0 Edge 组合拳抢单。
