<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket 15-Min Crypto Arbitrage Tool - API Test</title>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252545;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-green: #00d26a;
            --accent-red: #ff6b6b;
            --accent-blue: #4dabf7;
            --accent-yellow: #ffd43b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .api-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .api-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .api-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .method-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .method-get {
            background: rgba(77, 171, 247, 0.2);
            color: var(--accent-blue);
        }

        .method-post {
            background: rgba(0, 210, 106, 0.2);
            color: var(--accent-green);
        }

        .method-put {
            background: rgba(255, 212, 59, 0.2);
            color: var(--accent-yellow);
        }

        .method-delete {
            background: rgba(255, 107, 107, 0.2);
            color: var(--accent-red);
        }

        .endpoint {
            font-family: 'Fira Code', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            color: var(--accent-green);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--accent-yellow), #ff9f43);
            color: #1a1a2e;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-red), #ff8787);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(77, 171, 247, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response-container {
            margin-top: 1rem;
            max-height: 400px;
            overflow: auto;
        }

        .response-area {
            background: #0a0a15;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .positive {
            color: var(--accent-green);
        }

        .negative {
            color: var(--accent-red);
        }

        /* 配置组样式 */
        .config-groups {
            margin-top: 1rem;
        }

        .config-group {
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .config-group-header {
            padding: 1rem;
            background: rgba(77, 171, 247, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .config-group-header:hover {
            background: rgba(77, 171, 247, 0.2);
        }

        .config-group-body {
            padding: 1rem;
            display: none;
        }

        .config-group.expanded .config-group-body {
            display: block;
        }

        .config-field {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .config-field label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .config-field input {
            background: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 0.5rem;
            color: var(--text-primary);
            font-family: 'Fira Code', monospace;
        }

        .config-field input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* 模态框样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 1rem;
            background: var(--bg-primary);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
        }

        .modal-buttons .btn {
            flex: 1;
            margin: 0;
        }

        .modal-error {
            color: var(--accent-red);
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }

        .lock-icon {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Polymarket 15-Min Crypto Arbitrage Tool</h1>
        <p class="subtitle">API 测试控制台 - Leg1 Only 策略</p>

        <!-- Simulation Stats API -->
        <div class="api-section">
            <div class="api-header">
                <span class="api-title">📊 模拟交易统计</span>
                <span class="method-badge method-get">GET</span>
            </div>
            <div class="endpoint">/api/v1/sim-stats</div>
            <button class="btn btn-primary" onclick="fetchSimStats()">获取统计</button>

            <div id="stats-display" class="stats-grid" style="display: none;"></div>
            <div class="response-container">
                <div id="stats-response" class="response-area">点击上方按钮获取数据...</div>
            </div>
        </div>

        <!-- Copy Trading API -->
        <div class="api-section">
            <div class="api-header">
                <span class="api-title">🤖 模拟跟单控制</span>
                <span class="method-badge method-get">GET</span>
            </div>
            <div class="endpoint">/api/v1/sim-copy-trading?type=2</div>
            <button id="btn-start" class="btn btn-primary" onclick="promptOpCode('startCopyTrading')">🔐 启动模拟</button>
            <button id="btn-stop" class="btn btn-danger" onclick="promptOpCode('stopCopyTrading')">🔐 停止跟单</button>
            <div class="response-container">
                <div id="trading-response" class="response-area">敏感操作需要输入操作码...</div>
            </div>
        </div>

        <!-- Config Management API -->
        <div class="api-section">
            <div class="api-header">
                <span class="api-title">⚙️ 策略配置管理</span>
                <div>
                    <span class="method-badge method-get">GET</span>
                    <span class="method-badge method-put">PUT</span>
                    <span class="method-badge method-post">POST</span>
                </div>
            </div>
            <div class="endpoint">/api/v1/config</div>
            <button class="btn btn-primary" onclick="fetchConfig()">📋 获取配置</button>
            <button class="btn btn-warning" onclick="promptOpCode('saveConfig')">🔐 保存配置</button>
            <button class="btn btn-primary" onclick="promptOpCode('reloadConfig')">🔐 重新加载</button>

            <div id="config-groups" class="config-groups"></div>
            <div class="response-container">
                <div id="config-response" class="response-area">点击"获取配置"查看当前配置...</div>
            </div>
        </div>

        <!-- Delete Trades API -->
        <div class="api-section">
            <div class="api-header">
                <span class="api-title">🗑️ 清空所有交易数据</span>
                <span class="method-badge method-delete">DELETE</span>
            </div>
            <div class="endpoint">/api/v1/trades</div>
            <button class="btn btn-danger" onclick="deleteTrades()">⚠️ 确认清空</button>
            <div class="response-container">
                <div id="delete-response" class="response-area">慎用！此操作不可恢复。</div>
            </div>
        </div>
    </div>

    <!-- 操作码模态框 -->
    <div id="opCodeModal" class="modal-overlay">
        <div class="modal">
            <div class="lock-icon">🔐</div>
            <h2 class="modal-title">请输入操作码</h2>
            <p id="modal-error" class="modal-error">操作码错误，请重试</p>
            <input type="password" id="opCodeInput" class="modal-input" placeholder="••••••••" maxlength="20">
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="confirmOpCode()">确认</button>
                <button class="btn btn-danger" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 存储当前配置数据
        let currentConfig = [];
        // 当前待执行的操作
        let pendingAction = null;

        // ========== 操作码模态框 ==========
        function promptOpCode(action) {
            pendingAction = action;
            document.getElementById('opCodeModal').classList.add('active');
            document.getElementById('opCodeInput').value = '';
            document.getElementById('modal-error').style.display = 'none';
            document.getElementById('opCodeInput').focus();
        }

        function closeModal() {
            document.getElementById('opCodeModal').classList.remove('active');
            pendingAction = null;
        }

        function confirmOpCode() {
            const code = document.getElementById('opCodeInput').value;
            if (!code) {
                document.getElementById('modal-error').textContent = '请输入操作码';
                document.getElementById('modal-error').style.display = 'block';
                return;
            }

            closeModal();

            // 执行对应操作
            switch (pendingAction) {
                case 'startCopyTrading':
                    startCopyTrading(code);
                    break;
                case 'stopCopyTrading':
                    stopCopyTrading(code);
                    break;
                case 'saveConfig':
                    saveConfig(code);
                    break;
                case 'reloadConfig':
                    reloadConfig(code);
                    break;
            }
        }

        // 回车确认
        document.getElementById('opCodeInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                confirmOpCode();
            }
        });

        // 点击遮罩关闭
        document.getElementById('opCodeModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ========== API 调用 ==========
        async function fetchSimStats() {
            const responseEl = document.getElementById('stats-response');
            const statsDisplay = document.getElementById('stats-display');
            responseEl.textContent = '加载中...';

            try {
                const res = await fetch('/api/v1/sim-stats');
                const data = await res.json();
                responseEl.textContent = JSON.stringify(data, null, 2);

                if (data.success && data.summary) {
                    const s = data.summary;
                    const pnlClass = s.total_pnl >= 0 ? 'positive' : 'negative';
                    statsDisplay.style.display = 'grid';
                    statsDisplay.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-value">${s.trade_count}</div>
                            <div class="stat-label">交易次数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value ${pnlClass}">$${s.total_pnl.toFixed(2)}</div>
                            <div class="stat-label">总 PnL</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${s.win_count}</div>
                            <div class="stat-label">胜利次数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(s.win_rate * 100).toFixed(1)}%</div>
                            <div class="stat-label">胜率</div>
                        </div>
                    `;
                }
            } catch (err) {
                responseEl.textContent = '错误: ' + err.message;
            }
        }

        async function startCopyTrading(opCode) {
            const responseEl = document.getElementById('trading-response');
            const btnStart = document.getElementById('btn-start');

            btnStart.disabled = true;
            btnStart.textContent = '启动中...';
            responseEl.textContent = '启动中...';

            try {
                const res = await fetch('/api/v1/sim-copy-trading?type=2', {
                    headers: { 'X-Operation-Code': opCode }
                });
                const data = await res.json();
                responseEl.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                responseEl.textContent = '错误: ' + err.message;
            } finally {
                btnStart.disabled = false;
                btnStart.textContent = '🔐 启动模拟';
            }
        }

        async function stopCopyTrading(opCode) {
            const responseEl = document.getElementById('trading-response');
            const btnStop = document.getElementById('btn-stop');

            btnStop.disabled = true;
            btnStop.textContent = '停止中...';
            responseEl.textContent = '停止中...';

            try {
                const res = await fetch('/api/v1/sim-stop-trading', {
                    headers: { 'X-Operation-Code': opCode }
                });
                const data = await res.json();
                responseEl.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                responseEl.textContent = '错误: ' + err.message;
            } finally {
                btnStop.disabled = false;
                btnStop.textContent = '🔐 停止跟单';
            }
        }

        // ========== 配置管理 ==========
        async function fetchConfig() {
            const responseEl = document.getElementById('config-response');
            const groupsEl = document.getElementById('config-groups');
            responseEl.textContent = '加载中...';

            try {
                const res = await fetch('/api/v1/config');
                const data = await res.json();
                responseEl.textContent = JSON.stringify(data, null, 2);

                if (data.success && data.groups) {
                    currentConfig = data.groups;
                    renderConfigGroups(data.groups);
                }
            } catch (err) {
                responseEl.textContent = '错误: ' + err.message;
            }
        }

        function renderConfigGroups(groups) {
            const container = document.getElementById('config-groups');
            container.innerHTML = groups.map((group, index) => `
                <div class="config-group" id="group-${index}">
                    <div class="config-group-header" onclick="toggleGroup(${index})">
                        <span>📂 ${group.id || '配置组 ' + (index + 1)}</span>
                        <span>▼</span>
                    </div>
                    <div class="config-group-body">
                        ${renderConfigFields(group, index)}
                    </div>
                </div>
            `).join('');
        }

        function renderConfigFields(group, groupIndex) {
            const fields = [
                ['id', 'ID'],
                ['min_trend_percent_up', '做多最小趋势'],
                ['min_trend_percent_down', '做空最小趋势'],
                ['trend_window_sec_start', '窗口开始(秒)'],
                ['trend_window_sec_end', '窗口结束(秒)'],
                ['leg0_share_price_0', '最低价'],
                ['leg1_share_price_1', '价格阈值1'],
                ['leg1_share_price_2', '价格阈值2'],
                ['leg1_share_price_3', '价格阈值3'],
                ['leg1_share_amount_1', '数量1'],
                ['leg1_share_amount_2', '数量2'],
                ['leg1_share_amount_3', '数量3'],
                ['max_slippage', '最大滑点'],
                ['sigmoid_sensitivity', 'Sigmoid敏感度'],
                ['volatility_btc', 'BTC波动率'],
                ['volatility_eth', 'ETH波动率'],
                ['volatility_sol', 'SOL波动率'],
                ['volatility_xrp', 'XRP波动率'],
                ['tier_0_z_score', 'Tier0 Z-Score'],
                ['tier_1_z_score', 'Tier1 Z-Score'],
                ['tier_2_z_score', 'Tier2 Z-Score'],
                ['tier_3_z_score', 'Tier3 Z-Score'],
                ['tier_4_z_score', 'Tier4 Z-Score'],
                ['min_edge_tier_0', 'Tier0 最小Edge'],
                ['min_edge_tier_1', 'Tier1 最小Edge'],
                ['min_edge_tier_2', 'Tier2 最小Edge'],
                ['min_edge_tier_3', 'Tier3 最小Edge'],
                ['min_edge_tier_4', 'Tier4 最小Edge'],
            ];

            return fields.map(([key, label]) => `
                <div class="config-field">
                    <label>${label}</label>
                    <input type="text" 
                           data-group="${groupIndex}" 
                           data-key="${key}" 
                           value="${group[key] !== undefined ? group[key] : ''}"
                           onchange="updateConfigValue(${groupIndex}, '${key}', this.value)">
                </div>
            `).join('');
        }

        function toggleGroup(index) {
            const group = document.getElementById('group-' + index);
            group.classList.toggle('expanded');
        }

        function updateConfigValue(groupIndex, key, value) {
            if (!currentConfig[groupIndex]) return;

            // 尝试转换为数字
            const numValue = parseFloat(value);
            currentConfig[groupIndex][key] = isNaN(numValue) ? value : numValue;
        }

        async function saveConfig(opCode) {
            const responseEl = document.getElementById('config-response');

            if (currentConfig.length === 0) {
                responseEl.textContent = '请先获取配置';
                return;
            }

            responseEl.textContent = '保存中...';

            try {
                const res = await fetch('/api/v1/config', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Operation-Code': opCode
                    },
                    body: JSON.stringify({ groups: currentConfig })
                });
                const data = await res.json();
                responseEl.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                responseEl.textContent = '错误: ' + err.message;
            }
        }

        async function reloadConfig(opCode) {
            const responseEl = document.getElementById('config-response');
            responseEl.textContent = '重新加载中...';

            try {
                const res = await fetch('/api/v1/config/reload', {
                    method: 'POST',
                    headers: { 'X-Operation-Code': opCode }
                });
                const data = await res.json();
                responseEl.textContent = JSON.stringify(data, null, 2);

                if (data.success && data.groups) {
                    currentConfig = data.groups;
                    renderConfigGroups(data.groups);
                }
            } catch (err) {
                responseEl.textContent = '错误: ' + err.message;
            }
        }

        // ========== 数据清空 ==========
        async function deleteTrades() {
            if (!confirm('确定要清空所有模拟交易记录吗？此操作不可撤销！')) {
                return;
            }

            const responseEl = document.getElementById('delete-response');
            responseEl.textContent = '处理中...';

            try {
                const res = await fetch('/api/v1/trades', {
                    method: 'DELETE'
                });
                const data = await res.json();
                responseEl.textContent = JSON.stringify(data, null, 2);

                if (data.success) {
                    fetchSimStats();
                }
            } catch (err) {
                responseEl.textContent = '错误: ' + err.message;
            }
        }
    </script>
</body>

</html>
