# Default Strategy Configuration
# This file contains configuration for the Type2 Binance arbitrage strategy

groups:
  - id: "default"
    # Binance 趋势检测
    min_trend_percent_up: 0.0025     # 做多最小趋势阈值 (0.25%)
    min_trend_percent_down: 0.0020   # 做空最小趋势阈值 (0.20%)
    min_price_edge: 0.12             # 最小价格优势
    fair_price_trend_factor: 0.8     # 趋势到公允价的转换系数
    trend_window_sec_start: 180      # 开盘后多少秒开始检测 (3分钟)
    trend_window_sec_end: 600        # 开盘后多少秒停止检测 (10分钟)
    
    # 动态 Share 配置 (基于入场价格)
    leg0_share_price_0: 0.05         # 最低价格阈值 (低于此不买)
    leg1_share_price_1: 0.20         # 第一价格阈值
    leg1_share_price_2: 0.50         # 第二价格阈值  
    leg1_share_price_3: 0.85         # 第三价格阈值 (高于此不买)
    leg1_share_amount_1: 50          # 价格在 (0, 0.20] 买入数量
    leg1_share_amount_2: 30          # 价格在 (0.20, 0.50] 买入数量
    leg1_share_amount_3: 10          # 价格在 (0.50, 0.85] 买入数量
    
    # 其他配置
    fee_rate: 0.005                  # 费率 0.5%
    scan_interval_sec: 5             # 扫描间隔 (秒)
