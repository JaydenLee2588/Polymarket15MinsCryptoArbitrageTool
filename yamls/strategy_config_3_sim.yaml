# ==============================================================================
# Pattern-Based Strategy Configuration
# ==============================================================================
#
# 核心逻辑：
# 1. 在指定时间窗口内 [trend_window_sec_start, trend_window_sec_end] 监控市场
# 2. 当检测到 patterns 列表中的形态时触发买入
# 3. 根据当前价格选择对应的数量档位
# 4. 持仓后，当价格上涨达到 sell_threshold 时自动卖出
#
# 可用形态名称：
#   - 火箭发射 (ROCKET_LAUNCH) - 顺势多，强烈推荐
#   - 空中加油 (AERIAL_REFUEL) - 顺势多，推荐
#   - 断头铡刀 (GUILLOTINE) - 顺势空，强烈推荐
#   - 水下死叉 (UNDERWATER_DEAD) - 顺势空，推荐
#   - 底背离 (BULLISH_DIV) - 反转多，谨慎
#   - 极度超卖 (OVERSOLD) - 反转多，推荐
#   - 顶背离 (BEARISH_DIV) - 反转空，谨慎
#   - 情绪高潮 (CLIMAX_TOP) - 反转空，强烈推荐
#
# 审核优化建议：
#  根据 logs 里的今日log文件进行下列操作（请参考scripts里的脚本文件）：
#  1.分策略，计算每种策略的 次数，总PnL，胜率，决议和出售比例 ；
#  2.分策略，按照下单价格进行一下聚合(粒度以0.02美元为组)；
#  3.分策略，按照距离15分钟市场开启后的下单时间进行一下聚合(粒度以30秒为组)；
#  4.分策略，按照实际下单的UTC-5时间进行一下聚合PnL和胜率(粒度以30分钟为组，注意，LOG中不是UTC-5时间，我需要以UTC-5时间显示到md文档)；
#  5.分策略，对比配置文件，分析哪儿参数建议考虑调整。
# 将整理后的文档，放到 logs 的今日文件夹下，并命名为 strategy_analysis_HHMM.md (HHMM是分析的LOG文件名的时间)
# ==============================================================================

groups:
  - id: "Pattern策略1"
    trend_window_sec_start: 30
    trend_window_sec_end: 600
    leg0_share_price_0: 0.01
    leg1_share_price_1: 0.50
    leg1_share_price_2: 0.75
    leg1_share_price_3: 0.84
    leg1_share_amount_1: 7
    leg1_share_amount_2: 4
    leg1_share_amount_3: 3
    max_slippage: 0.03
    patterns:
      - "火箭发射"
      - "空中加油"
    sell_threshold: 0.15
    enable_stop_loss: true
    stop_loss_minutes_before_close: 3
    symbols:
