# ==============================================================================
# Polymarket 15分钟加密货币套利策略配置
# ==============================================================================
#
# 核心算法说明:
#
# 1. 趋势检测 (Binance):
#    - 监控 Binance 上对应币种 (BTC, ETH, SOL, XRP) 的 15分钟 K线。
#    - 趋势百分比 (Trend%) = (当前价格 - K线开盘价) / K线开盘价。
#
# 2. 公允价格计算 (Sigmoid Z-Score Model):
#    - 使用 Sigmoid 函数将趋势强度映射到 [0, 1] 的概率区间。
#    - Z-Score = Trend% / (波动率 * sqrt(时间比率))
#    - FairPrice = 1 / (1 + e^(-K * Z))
#    - 其中 K 为敏感度系数 (sigmoid_sensitivity)，时间比率 = 剩余秒数 / 900。
#    - 特性: 剩余时间越少，同样的趋势产生的 Z-Score 越高 (Gamma 效应)，公允价越极端。
#
# 3. 动态优势判定 (Dynamic Edge Tier System):
#    -根据 Z-Score 的强度，动态调整入场所需的最小价格优势 (MinPriceEdge)。
#    - 逻辑: 信号越强 (Z 越高)，我们可以接受更小的优势 (Edge) 来换取更高的成交率。
#    - Tier 0: Z < Tier0 (0.5)，信号太弱，直接过滤不交易。
#    - Tier 1: Z [0.8, 1.0)，要求 Edge >= 0.08 (高要求)。
#    - ...
#    - Tier 4: Z >= 2.0，要求 Edge >= 0.00 (只要不亏本就抢)。
#
# 备注：min_trend_percent_up = min_trend_percent_down = 0.2 时，leg1_share_price_3 可以设置到0.95，全是稳赚的
# ==============================================================================

groups:
  - id: "基准1号"
    min_trend_percent_up: 0.0015      # 调高了一些，从0.0013升级到0.0015
    min_trend_percent_down: 0.0015    # 调高了一些，从0.0013升级到0.0015
    trend_window_sec_start: 320
    trend_window_sec_end: 480
    leg0_share_price_0: 0.62
    leg1_share_price_1: 0.71
    leg1_share_price_2: 0.78
    leg1_share_price_3: 0.84
    leg1_share_amount_1: 70
    leg1_share_amount_2: 40
    leg1_share_amount_3: 25
    max_slippage: 0.03
    price_tick_size: 0.01
    sigmoid_sensitivity: 1.8
    volatility_btc: 0.0012
    volatility_eth: 0.0012
    volatility_sol: 0.0024
    volatility_xrp: 0.0015
    tier_0_z_score: 1.5
    tier_1_z_score: 1.6
    tier_2_z_score: 1.7
    tier_3_z_score: 1.8
    tier_4_z_score: 2.0
    min_edge_tier_0: 0.03
    min_edge_tier_1: 0.02
    min_edge_tier_2: 0.01
    min_edge_tier_3: 0.00
    min_edge_tier_4: 0.00

  - id: "基本2号"
    min_trend_percent_up: 0.0022      # 从0.002升级限制到0.22%
    min_trend_percent_down: 0.0022    # 从0.002升级限制到0.22%
    trend_window_sec_start: 300
    trend_window_sec_end: 450         
    leg0_share_price_0: 0.62          
    leg1_share_price_1: 0.71
    leg1_share_price_2: 0.78
    leg1_share_price_3: 0.84          
    leg1_share_amount_1: 90
    leg1_share_amount_2: 60
    leg1_share_amount_3: 30
    max_slippage: 0.03                
    price_tick_size: 0.01
    sigmoid_sensitivity: 2.0          
    volatility_btc: 0.0012
    volatility_eth: 0.0012
    volatility_sol: 0.0012
    volatility_xrp: 0.0012
    tier_0_z_score: 1.0               
    tier_1_z_score: 1.2
    tier_2_z_score: 1.4
    tier_3_z_score: 1.6
    tier_4_z_score: 2.0
    min_edge_tier_0: 0.05             
    min_edge_tier_1: 0.04
    min_edge_tier_2: 0.03
    min_edge_tier_3: 0.02
    min_edge_tier_4: 0.01 

  - id: "基本3号"
    # 暂时保留，虽然真是盘亏的，但是模拟盘里赚的很。
    min_trend_percent_up: 0.0035      # [对比] 极高阈值 (0.25%)，只做大行情
    min_trend_percent_down: 0.0035    # [对比]
    trend_window_sec_start: 350       # [对比] 只要趋势出来，可以很早进场
    trend_window_sec_end: 590         # [对比] 延迟离场时间
    leg0_share_price_0: 0.55          # [对比] 低价位
    leg1_share_price_1: 0.71
    leg1_share_price_2: 0.78          # [对比] 允许较高位置追突破
    leg1_share_price_3: 0.84          # [对比] 接近满值也追
    leg1_share_amount_1: 100
    leg1_share_amount_2: 80
    leg1_share_amount_3: 40
    max_slippage: 0.04                # 突破行情波动大，稍宽滑点
    price_tick_size: 0.01
    sigmoid_sensitivity: 2.2          # [对比] 高K值，一旦突破，S曲线迅速拉升
    volatility_btc: 0.0012
    volatility_eth: 0.0012
    volatility_sol: 0.0012
    volatility_xrp: 0.0012
    tier_0_z_score: 0.8       # [对比] 只要Z > 0.8 就进 (因为有强趋势背书)
    tier_1_z_score: 1.0
    tier_2_z_score: 1.2
    tier_3_z_score: 1.4
    tier_4_z_score: 1.8
    min_edge_tier_0: 0.01     # [对比] 只要微弱优势即可
    min_edge_tier_1: 0.00     # 平价即可
    min_edge_tier_2: 0.00
    min_edge_tier_3: 0.00
    min_edge_tier_4: 0.00

  - id: "仿AI测试参数3"
    # [趋势] 只有大行情才开火
    min_trend_percent_up: 0.0045       # 0.4% (非常高，一天可能只触发几次)
    min_trend_percent_down: 0.0045
    # [时间] 拉长窗口，因为大行情稀缺，不想错过尾盘的绝杀
    trend_window_sec_start: 300       # 5分钟后
    trend_window_sec_end: 780         # 一直到 13分钟
    # [价格] 极其保守的买入区间
    leg0_share_price_0: 0.10          # 暂时还是放的非常低 【要小心】        
    leg1_share_price_1: 0.69          # 0.6790 -> 0.68 (核心重仓区)
    leg1_share_price_2: 0.78          # 0.8710 -> 0.85
    leg1_share_price_3: 0.84          # [核心] 0.8825 -> 0.88 (铁底线，过了绝不买)
    # [仓位] 甚至比AI更极端的倒金字塔
    leg1_share_amount_1: 150          # 便宜：梭哈
    leg1_share_amount_2: 60           # 正常：半仓
    leg1_share_amount_3: 15           # 贵了：象征性买10手
    # [执行]
    max_slippage: 0.03                # 严控滑点
    price_tick_size: 0.01
    # [模型] 保持高敏
    sigmoid_sensitivity: 4.5          # AI是 4.5375
    # [波动率] 平滑化
    volatility_btc: 0.004
    volatility_eth: 0.001
    volatility_sol: 0.006
    volatility_xrp: 0.008
    # [阈值] 既然门槛高达0.4%，Z-Score其实已经不重要了，设低点方便触发
    tier_0_z_score: 0.5               
    tier_1_z_score: 1.0
    tier_2_z_score: 2.5
    tier_3_z_score: 3.0
    tier_4_z_score: 4.0
    # [优势] 允许追单 (负Edge)
    min_edge_tier_0: -0.50
    min_edge_tier_1: -0.50
    min_edge_tier_2: -0.50
    min_edge_tier_3: -0.50
    min_edge_tier_4: -0.50