# ==============================================================================
# Polymarket 15分钟加密货币套利策略配置
# ==============================================================================
#
# 核心算法说明:
#
# 1. 趋势检测 (Binance):
#    - 监控 Binance 上对应币种 (BTC, ETH, SOL, XRP) 的 15分钟 K线。
#    - 趋势百分比 (Trend%) = (当前价格 - K线开盘价) / K线开盘价。
#
# 2. 公允价格计算 (Sigmoid Z-Score Model):
#    - 使用 Sigmoid 函数将趋势强度映射到 [0, 1] 的概率区间。
#    - Z-Score = Trend% / (波动率 * sqrt(时间比率))
#    - FairPrice = 1 / (1 + e^(-K * Z))
#    - 其中 K 为敏感度系数 (sigmoid_sensitivity)，时间比率 = 剩余秒数 / 900。
#    - 特性: 剩余时间越少，同样的趋势产生的 Z-Score 越高 (Gamma 效应)，公允价越极端。
#
# 3. 动态优势判定 (Dynamic Edge Tier System):
#    -根据 Z-Score 的强度，动态调整入场所需的最小价格优势 (MinPriceEdge)。
#    - 逻辑: 信号越强 (Z 越高)，我们可以接受更小的优势 (Edge) 来换取更高的成交率。
#    - Tier 0: Z < Tier0 (0.5)，信号太弱，直接过滤不交易。
#    - Tier 1: Z [0.8, 1.0)，要求 Edge >= 0.08 (高要求)。
#    - ...
#    - Tier 4: Z >= 2.0，要求 Edge >= 0.00 (只要不亏本就抢)。
#
# ==============================================================================

groups:
  - id: "基准1号"
    # --------------------------------------------------------------------------
    # 1. Binance 趋势检测参数
    # --------------------------------------------------------------------------
    min_trend_percent_up: 0.002      # 做多最小趋势阈值 (0.2%)，只有涨幅超过此值才开始计算
    min_trend_percent_down: 0.002    # 做空最小趋势阈值 (0.2%)，只有跌幅超过此值才开始计算
    trend_window_sec_start: 350      # 趋势检测窗口起点: 开盘后 350秒 (约5分钟) 开始
    trend_window_sec_end: 480        # 趋势检测窗口终点: 开盘后 480秒 (8分钟) 停止检测

    # --------------------------------------------------------------------------
    # 2. 资金管理与买入限制
    # --------------------------------------------------------------------------
    leg0_share_price_0: 0.60          # 保护性低价: 价格低于 1美分不买 (避免垃圾归零单)
    leg1_share_price_1: 0.70          # 分档买入: 价格在 (0.54, 0.66] 区间
    leg1_share_price_2: 0.78          # 分档买入: 价格在 (0.66, 0.78] 区间  
    leg1_share_price_3: 0.83          # 最高买入价: 价格高于 0.93 (93美分) 不再追高
    leg1_share_amount_1: 11           # 档位 1 的单笔买入 Share 数量
    leg1_share_amount_2: 10           # 档位 2 的单笔买入 Share 数量
    leg1_share_amount_3: 9            # 档位 3 的单笔买入 Share 数量

    # --------------------------------------------------------------------------
    # 3. 订单执行配置
    # --------------------------------------------------------------------------
    max_slippage: 0.07                # 最大允许滑点 (单位: 美元)，用于 Taker 吃单保护
    price_tick_size: 0.01             # 交易所最小价格变动单位 (1美分)

    # --------------------------------------------------------------------------
    # 4. Sigmoid 公允价模型参数
    # --------------------------------------------------------------------------
    sigmoid_sensitivity: 1.5          # K值敏感度: 控制S曲线陡峭程度。值越小越保守，越大越激进
    volatility_btc: 0.0015             # BTC 波动率因子 (0.15%): 用于 Z-Score 分母标准化
    volatility_eth: 0.0012             # ETH 波动率因子 (0.12%)
    volatility_sol: 0.0012            # SOL 波动率因子 (0.12%)
    volatility_xrp: 0.0015            # XRP 波动率因子 (0.15%)

    # --------------------------------------------------------------------------
    # 5. 动态优势判定配置 (Tier System)
    # --------------------------------------------------------------------------
    # Z-Score 阈值定义
    tier_0_z_score: 0.6       # Tier 0 门槛: Z < 0.6 时，信号无效，不交易
    tier_1_z_score: 0.8       # Tier 1 门槛: 0.6 <= Z < 0.8
    tier_2_z_score: 1.0       # Tier 2 门槛: 0.8 <= Z < 1.0
    tier_3_z_score: 1.4       # Tier 3 门槛: 1.0 <= Z < 1.4
    tier_4_z_score: 2.0       # Tier 4 门槛: Z >= 2.0
    
    # 对应的最小优势 (Sigmoid公允价 - 市场卖一价) 要求
    min_edge_tier_0: 0.06     # Z [0.6, 0.8): 信号微弱，要求极大优势 (13美分) 才买
    min_edge_tier_1: 0.05     # Z [0.8, 1.0): 信号一般，要求较大优势 (10美分)
    min_edge_tier_2: 0.03     # Z [1.0, 1.4): 信号较强，要求中等优势 (6美分)
    min_edge_tier_3: 0.01     # Z [1.4, 2.0): 信号很强，要求微小优势 (3美分)
    min_edge_tier_4: 0.00     # Z >= 2.0:     信号极强，只要不亏本 (0优势) 就可以抢单一