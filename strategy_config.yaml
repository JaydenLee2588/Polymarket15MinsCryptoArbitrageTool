groups:
  - id: "F1.95_88_320"
    # Binance 趋势检测
    min_trend_percent_up: 0.0015      # 做多最小趋势阈值 (0.15%)
    min_trend_percent_down: 0.0015    # 做空最小趋势阈值 (0.15%)
    min_price_edge: 0.08             # 最小价格优势
    fair_price_trend_factor: 1.95    # 趋势到公允价的转换系数
    trend_window_sec_start: 88       # 开盘后多少秒开始检测 (接近1分钟半)
    trend_window_sec_end: 320        # 开盘后多少秒停止检测 (6分钟)
    # 动态 Share 配置 (基于入场价格)
    leg0_share_price_0: 0.54         # 最低价格阈值 (低于此不买)
    leg1_share_price_1: 0.66         # 第一价格阈值
    leg1_share_price_2: 0.78         # 第二价格阈值  
    leg1_share_price_3: 0.90         # 第三价格阈值 (高于此不买)
    leg1_share_amount_1: 40          # 价格在 (0.54, 0.66] 买入数量
    leg1_share_amount_2: 33          # 价格在 (0.66, 0.78] 买入数量
    leg1_share_amount_3: 28          # 价格在 (0.78, 0.90] 买入数量
    # 其他配置
    fee_rate: 0.003                  # 费率 0.3%

